[project]
name = "dl909markdowntree"
version = "0.1.0"
description = "A library for tree-structured Markdown document parsing and read/write permission control."
readme = "README.md"
authors = [{ name = "DL909", email = "matthewDingL@outlook.com" }]
requires-python = ">=3.11"
dependencies = [
  "lxml>=6.1.1",
  "pydantic>=2.13.4",
  "pydantic-yaml>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl909markdowntree"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
  "pdbpp>=0.12.1",
  "pyfakefs>=6.2.0",
  "pyright>=1.1.410",
  "pytest>=9.1.1",
  "ruff>=0.15.18",
]
