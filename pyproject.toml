[project]
name = "dl909markdowntree"
version = "0.1.4"
description = "A library for tree-structured Markdown document parsing and read/write permission control."
readme = "README.md"
authors = [{ name = "DL909", email = "matthewDingL@outlook.com" }]
requires-python = ">=3.12"
dependencies = ["lxml>=6.1.1", "pydantic>=2.13.4", "pydantic-yaml>=1.6.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl909markdowntree"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.optional-dependencies]
mcp = ["fastmcp>=0.4.0"]
langchain = ["langchain-core>=0.3.0"]
all = ["fastmcp>=0.4.0", "langchain-core>=0.3.0"]

[dependency-groups]
dev = [
  "pdbpp>=0.12.1",
  "pyfakefs>=6.2.0",
  "pyright>=1.1.410",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.18",
  "twine>=7.0.0",
]
