[project]
name = "dl909agentframwork"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "DL909", email = "matthewDingL@outlook.com" }]
requires-python = ">=3.11"
dependencies = [
  "lxml>=6.1.1",
  "openai>=2.43.0",
  "pydantic>=2.13.4",
  "pydantic-yaml>=1.6.0",
  "python-dotenv>=1.2.2",
  "send2trash>=2.1.0",
  "typing>=3.10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl909agentframwork"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"
reportCallIssue = "none"

[dependency-groups]
dev = [
  "pdbpp>=0.12.1",
  "pyfakefs>=6.2.0",
  "pyright>=1.1.410",
  "pytest>=9.1.1",
  "ruff>=0.15.18",
]
